name: Deploy backend to Fly

on:
  push:
    branches: [ 'mvp/auto-clipper' ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v2
        with:
          version: '0.1.29'

      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_NAME: ${{ secrets.FLY_APP_NAME }}
        run: |
          set -e
          if [ -z "${FLY_APP_NAME}" ]; then
            echo "FLY_APP_NAME secret is not set. Please add it to the repository secrets."
            exit 1
          fi
          flyctl deploy --app "${FLY_APP_NAME}" --remote-only
